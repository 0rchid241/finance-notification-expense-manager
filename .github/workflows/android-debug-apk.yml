name: Android External Test APK

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'android/**'
      - '.github/workflows/android-debug-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build external test APK
        run: ./gradlew assembleExternalDebug

      - name: Upload external test APK
        uses: actions/upload-artifact@v4
        with:
          name: finance-notification-manager-external-dev
          path: android/app/build/outputs/apk/externalDebug/app-externalDebug.apk
          if-no-files-found: error
          retention-days: 14
